<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wwebba Teste</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Wwebba Teste</h1>
        <p>Aprenda, pratique e teste os seus conhecimentos.</p>
    </header>

    <main>
        <section id="inicio">
            <h2>Bem-vindo ao Wwebba Teste!</h2>

            <p>Escolha uma disciplina para começar:</p>

            <div class="disciplinas">
                <button onclick="iniciarTeste('Química')">
                    🧪 Química
                </button>

                <button onclick="iniciarTeste('Português')">
                    📚 Língua Portuguesa
                </button>

                <button onclick="iniciarTeste('Matemática')">
                    📐 Matemática
                </button>

                <button onclick="iniciarTeste('Biologia')">
                    🧬 Biologia
                </button>
            </div>
        </section>

        <section id="teste" class="oculto">
            <h2 id="tituloTeste"></h2>

            <div id="questao"></div>

            <div id="opcoes"></div>

            <button id="proxima" onclick="proximaQuestao()">
                Próxima questão
            </button>
        </section>

        <section id="resultado" class="oculto">
            <h2>Resultado</h2>

            <p id="pontuacao"></p>

            <button onclick="voltarInicio()">
                🔄 Fazer outro teste
            </button>
        </section>
    </main>

    <footer>
        <p>© 2026 Wwebba Teste</p>
    </footer>

    <script src="app.js"></script>

</body>
</html>
